<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Context</title>
  <script src="/preload.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:ROND,opsz,slnt,wdth,wght@0..100,6..144,-10..0,92..100,100..1000&family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap">
  <link rel="stylesheet" href="/styles.css?v=1.4.0">
</head>
<body>
  <div id="loading" class="loading" aria-live="polite" aria-busy="true">
    <div class="skel-head">
      <span class="skel" style="width: 28%; height: 14px"></span>
      <span class="skel" style="width: 34%; height: 14px"></span>
    </div>
    <span class="skel" style="width: 100%; height: 8px; border-radius: 999px"></span>
    <div class="skel-list">
      <span class="skel" style="width: 100%; height: 18px"></span>
      <span class="skel" style="width: 100%; height: 18px"></span>
      <span class="skel" style="width: 100%; height: 18px"></span>
      <span class="skel" style="width: 100%; height: 18px"></span>
      <span class="skel" style="width: 78%; height: 18px"></span>
    </div>
  </div>

  <div id="panel" class="panel hidden" data-testid="context-panel">
    <main class="main">
      <!-- Summary Hero -->
      <section class="summary" aria-label="Context usage summary">
        <div class="summary-top">
          <span id="used-pct" class="used-pct num">0% used</span>
          <div class="summary-controls">
            <div id="ratio-group" class="ratio-group num">
              <span id="used-tok">0</span>
              <span class="ratio-sep">/</span>
              <span id="limit-tok" class="limit-tok">1M</span>
            </div>
            <div class="segmented" role="group" aria-label="Visualization mode">
              <button type="button" id="view-bar-btn" class="seg-btn on" data-view="bar" aria-label="Bar view" aria-pressed="true" title="Stacked bar view">
                <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
                  <rect x="1.5" y="5.5" width="4.5" height="3" rx="1" fill="currentColor"/>
                  <rect x="6.75" y="5.5" width="3" height="3" rx="1" fill="currentColor" opacity="0.65"/>
                  <rect x="10.5" y="5.5" width="2" height="3" rx="1" fill="currentColor" opacity="0.32"/>
                </svg>
              </button>
              <button type="button" id="view-grid-btn" class="seg-btn" data-view="grid" aria-label="Grid view" aria-pressed="false" title="Proportional cell grid view">
                <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
                  <rect x="1.5" y="3.5" width="3" height="3" rx="0.6" fill="currentColor"/>
                  <rect x="5.5" y="3.5" width="3" height="3" rx="0.6" fill="currentColor" opacity="0.7"/>
                  <rect x="9.5" y="3.5" width="3" height="3" rx="0.6" fill="currentColor" opacity="0.35"/>
                  <rect x="1.5" y="7.5" width="3" height="3" rx="0.6" fill="currentColor"/>
                  <rect x="5.5" y="7.5" width="3" height="3" rx="0.6" fill="currentColor" opacity="0.7"/>
                  <rect x="9.5" y="7.5" width="3" height="3" rx="0.6" fill="currentColor" opacity="0.35"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div id="bar-wrap" class="bar-track" role="img" aria-label="Context window breakdown bar"></div>
        <div id="grid-wrap" class="cell-grid hidden" role="img" aria-label="Proportional context cell grid"></div>

        <div class="meta-strip">
          <div class="meta-item clickable-meta" id="cache-meta" role="button" tabindex="0">
            <span id="cache-label" class="meta-label">Last-turn cache</span>
            <span id="cache-val" class="meta-value num">0%</span>
          </div>
          <span id="checkpoint-pill" class="checkpoint-pill num hidden"></span>
        </div>
      </section>

      <!-- Per-Request Prompt Cache Trajectory -->
      <section id="cache-section" class="cache-card hidden" aria-label="Per-request prompt cache trajectory">
        <div class="cache-head">
          <div class="cache-title-group">
            <span class="cache-live-dot" aria-hidden="true"></span>
            <span class="cache-title">Cache hit rate trajectory</span>
            <span id="cache-req-badge" class="badge num">0 reqs</span>
          </div>
          <div class="cache-legend">
            <span class="legend-item" title="Single request cache hit rate (cache_read_tokens / total_prompt_tokens)">
              <span class="legend-line solid"></span>Per-req
            </span>
            <span class="legend-item" title="Cumulative session cache hit rate up to each request">
              <span class="legend-line dashed"></span>Session
            </span>
          </div>
        </div>

        <div id="cache-kpi-row" class="cache-kpis num"></div>

        <div id="cache-chart-wrap" class="cache-chart-wrap">
          <svg id="cache-chart-svg" class="cache-chart-svg" role="img" aria-label="Continuously evolving cache hit rate line chart"></svg>
        </div>

        <div id="cache-inspect-bar" class="cache-inspect num"></div>

        <details id="sec-cache-reqs" class="cache-reqs" open>
          <summary class="cache-reqs-head">
            <svg class="chev" width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
            <span class="cache-reqs-title">Every request</span>
            <span id="cache-reqs-summary" class="cache-reqs-meta num"></span>
            <button type="button" id="cache-order-btn" class="order-btn" title="Switch request list sort order">Newest ↓</button>
          </summary>
          <div id="cache-req-list" class="cache-req-list"></div>
        </details>
      </section>

      <!-- Breakdown Table -->
      <section class="breakdown" aria-label="Token breakdown by category">
        <div id="rows-active" class="cat-list"></div>
        <div class="divider" role="separator"></div>
        <div id="rows-window" class="cat-list"></div>
        <div id="deferred-divider" class="divider hidden" role="separator"></div>
        <div id="rows-deferred" class="cat-list"></div>
      </section>

      <!-- Drill-Down Sections -->
      <section id="accordions" class="accordions" aria-label="Detailed inspections">
        <details id="sec-tools" class="acc hidden">
          <summary class="acc-head">
            <svg class="chev" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
            <span class="acc-title">Tool calls</span>
            <span id="count-tools" class="acc-count">0</span>
          </summary>
          <div id="body-tools" class="acc-body"></div>
        </details>

        <details id="sec-mcp" class="acc hidden">
          <summary class="acc-head">
            <svg class="chev" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
            <span class="acc-title">MCP tools</span>
            <span id="count-mcp" class="acc-count">0</span>
          </summary>
          <div id="body-mcp" class="acc-body"></div>
        </details>

        <details id="sec-rules" class="acc hidden">
          <summary class="acc-head">
            <svg class="chev" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
            <span class="acc-title">Rules &amp; memory</span>
            <span id="count-rules" class="acc-count">0</span>
          </summary>
          <div id="body-rules" class="acc-body"></div>
        </details>

        <details id="sec-skills" class="acc hidden">
          <summary class="acc-head">
            <svg class="chev" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
            <span class="acc-title">Skills</span>
            <span id="count-skills" class="acc-count">0</span>
          </summary>
          <div id="body-skills" class="acc-body"></div>
        </details>

        <details id="sec-agents" class="acc hidden">
          <summary class="acc-head">
            <svg class="chev" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
            <span class="acc-title">Agents &amp; subagents</span>
            <span id="count-agents" class="acc-count">0</span>
          </summary>
          <div id="body-agents" class="acc-body"></div>
        </details>

        <details id="sec-artifacts" class="acc hidden">
          <summary class="acc-head">
            <svg class="chev" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
            <span class="acc-title">Artifacts</span>
            <span id="count-artifacts" class="acc-count">0</span>
          </summary>
          <div id="body-artifacts" class="acc-body"></div>
        </details>

        <details id="sec-growth" class="acc hidden">
          <summary class="acc-head">
            <svg class="chev" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
            <span class="acc-title">Context growth</span>
            <span id="count-growth" class="acc-count">0</span>
          </summary>
          <div id="body-growth" class="acc-body"></div>
        </details>
      </section>
    </main>
  </div>

  <section id="empty" class="empty hidden" aria-labelledby="empty-title">
    <div class="empty-card">
      <svg class="empty-icon" width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
        <rect x="4" y="10" width="28" height="6" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <rect x="4" y="20" width="18" height="3.5" rx="1.75" fill="currentColor" opacity="0.35"/>
        <rect x="4" y="26" width="24" height="3.5" rx="1.75" fill="currentColor" opacity="0.18"/>
      </svg>
      <h2 id="empty-title" class="empty-title">No turns recorded yet</h2>
      <p id="empty-desc" class="empty-desc">Send a message in this conversation to see its token breakdown.</p>
    </div>
  </section>

  <script src="/app.js?v=1.4.0"></script>
</body>
</html>
